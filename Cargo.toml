[package]
name = "gearman"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Native async Gearman protocol client and worker, built on tokio"
repository = "https://github.com/p-alik/gearman-rs"
keywords = ["gearman", "job-queue", "distributed", "tokio"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["client", "worker"]
client = []
worker = []
admin = []
tls = ["dep:tokio-rustls"]

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls-pemfile = "2"

[[example]]
name = "client_submit"
required-features = ["client"]

[[example]]
name = "worker_reverse"
required-features = ["worker"]

[[test]]
name = "client_integration"
required-features = ["client"]

[[test]]
name = "client_worker_roundtrip"
required-features = ["client", "worker"]

[[test]]
name = "admin_integration"
required-features = ["client", "worker", "admin"]

[[test]]
name = "tls_integration"
required-features = ["client", "tls"]

[[test]]
name = "client_fake_server"
required-features = ["client"]

[[test]]
name = "worker_fake_server"
required-features = ["worker"]

[[test]]
name = "admin_fake_server"
required-features = ["admin"]

[[test]]
name = "worker_panic_shutdown"
required-features = ["worker"]

[[test]]
name = "worker_backoff_shutdown"
required-features = ["worker"]
