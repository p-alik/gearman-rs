name: CI
on: [push, pull_request]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Build gearmand from the sibling C repo so integration tests run
      # against a real server instead of soft-skipping.
      - name: Checkout gearmand
        uses: actions/checkout@v4
        with: { repository: gearman/gearmand, path: gearmand-c }
      - name: Build gearmand
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libevent-dev gperf libssl-dev uuid-dev
          cd gearmand-c && ./bootstrap.sh && ./configure --enable-ssl && make -j"$(nproc)" gearmand/gearmand
          # bootstrap.sh's own internal configure sanity-check can fail
          # (e.g. a missing build dep) without making bootstrap.sh itself
          # exit non-zero, so a broken build here would otherwise pass
          # this step silently and every real-gearmand integration test
          # would silently soft-skip instead of failing loudly.
          test -x gearmand/gearmand || { echo "::error::gearmand did not build"; exit 1; }
          echo "$PWD" >> "$GITHUB_PATH"
      - run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      # Excludes `tls`: rustls's aws-lc-rs backend pulls in zeroize, whose
      # latest release needs edition2024 (Rust 1.85+) regardless of the
      # 1.75 MSRV this crate itself and aws-lc-rs/rustls both declare. See
      # README.md#msrv for why we don't chase this upstream.
      - run: cargo check --features client,worker,admin

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Same real gearmand as the `test` job, so integration tests
      # contribute real coverage instead of soft-skipping.
      - name: Checkout gearmand
        uses: actions/checkout@v4
        with: { repository: gearman/gearmand, path: gearmand-c }
      - name: Build gearmand
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libevent-dev gperf libssl-dev uuid-dev
          cd gearmand-c && ./bootstrap.sh && ./configure --enable-ssl && make -j"$(nproc)" gearmand/gearmand
          test -x gearmand/gearmand || { echo "::error::gearmand did not build"; exit 1; }
          echo "$PWD" >> "$GITHUB_PATH"
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
