name: CI
on: [push, pull_request]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gearmand
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libevent-dev gperf libssl-dev uuid-dev
          # A release tarball, not a git checkout: gearmand's Makefile.am
          # only adds `docs` (which needs sphinx-build, which we don't
          # have and don't need) to SUBDIRS when it detects a VCS
          # checkout (a .git/.svn/.hg/.bzr dir); a tarball also ships a
          # pre-generated `configure` and pre-generated gperf headers, so
          # this needs no bootstrap.sh/autoreconf either. Bump the
          # version below to track a newer gearmand release.
          mkdir gearmand-c
          curl -sL https://github.com/gearman/gearmand/releases/download/2.1.0/gearmand-2.1.0.tar.gz | tar xz -C gearmand-c --strip-components=1
          cd gearmand-c && ./configure --enable-ssl && make -j"$(nproc)" gearmand/gearmand
          # A broken build can leave `make` looking like it "ran" without
          # producing a binary, so check for the real thing rather than
          # trusting its exit code - otherwise every real-gearmand
          # integration test would silently soft-skip instead of failing.
          test -x gearmand/gearmand || { echo "::error::gearmand did not build"; exit 1; }
          echo "$PWD" >> "$GITHUB_PATH"
      - run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      # Excludes `tls`: rustls's aws-lc-rs backend pulls in zeroize, whose
      # latest release needs edition2024 (Rust 1.85+) regardless of the
      # 1.75 MSRV this crate itself and aws-lc-rs/rustls both declare. See
      # README.md#msrv for why we don't chase this upstream.
      - run: cargo check --features client,worker,admin

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Same real gearmand as the `test` job, so integration tests
      # contribute real coverage instead of soft-skipping.
      - name: Build gearmand
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libevent-dev gperf libssl-dev uuid-dev
          mkdir gearmand-c
          curl -sL https://github.com/gearman/gearmand/releases/download/2.1.0/gearmand-2.1.0.tar.gz | tar xz -C gearmand-c --strip-components=1
          cd gearmand-c && ./configure --enable-ssl && make -j"$(nproc)" gearmand/gearmand
          test -x gearmand/gearmand || { echo "::error::gearmand did not build"; exit 1; }
          echo "$PWD" >> "$GITHUB_PATH"
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
